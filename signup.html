<!DOCTYPE html>
<html>

<head>


    <title>Sign Up - My To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-body">


    <div class="auth-box">


        <h1>📝 My To-Do List</h1>


        <h2>Create Account</h2>


        <p>
            Create your account
        </p>


        <input
            type="text"
            id="signupName"
            placeholder="Enter Name"
        >


        <input
            type="email"
            id="signupEmail"
            placeholder="Enter Email"
        >


        <input
            type="password"
            id="signupPassword"
            placeholder="Create Password"
        >


        <button onclick="signup()">
            ✨ Create Account
        </button>


        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>


    <script src="script.js"></script>

</body>

</html>
