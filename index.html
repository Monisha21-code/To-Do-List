<!DOCTYPE html>
<html>

<head>


    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <h2>📝 My To-Do List</h2>

        <div class="nav-links">

            <a href="index.html">🏠 Home</a>

            <a href="profile.html">👤 Profile</a>

            <a href="history.html">📜 History</a>

        </div>

    </nav>



    <!-- MAIN CONTENT -->

    <div class="container">


        <h1>Welcome to My To-Do List</h1>


        <p class="welcome-text">

            Organize your daily tasks easily.

        </p>



        <!-- DASHBOARD -->

        <h2 class="section-title">
            📊 Task Dashboard
        </h2>


        <div class="dashboard">


            <div class="dashboard-box">

                <div class="dashboard-icon">
                    📋
                </div>

                <h3 id="totalTasks">0</h3>

                <p>Total Tasks</p>

            </div>



            <div class="dashboard-box">

                <div class="dashboard-icon">
                    ⏳
                </div>

                <h3 id="pendingTasks">0</h3>

                <p>Pending</p>

            </div>



            <div class="dashboard-box">

                <div class="dashboard-icon">
                    🔄
                </div>

                <h3 id="progressTasks">0</h3>

                <p>In Progress</p>

            </div>



            <div class="dashboard-box">

                <div class="dashboard-icon">
                    ✅
                </div>

                <h3 id="completedTasks">0</h3>

                <p>Completed</p>

            </div>


        </div>



        <!-- PROGRESS -->

        <div class="progress-box">

            <h2>📈 My Progress</h2>

            <h3 id="progressPercentage">
                0%
            </h3>

            <div class="progress-bar">

                <div
                    id="progressBar"
                    class="progress-fill">
                </div>

            </div>

        </div>



        <!-- CREATE TASK -->

        <div class="create-task-box">

            <h2>➕ Create New Task</h2>


            <input
                type="text"
                id="taskTitle"
                placeholder="Enter task title"
            >


            <textarea
                id="taskDescription"
                placeholder="Enter task description"
            ></textarea>


            <label>
                📅 Due Date
            </label>


            <input
                type="date"
                id="taskDate"
            >


            <button onclick="createTask()">
                ➕ Add Task
            </button>

        </div>



        <!-- MY TASKS -->

        <h2 class="section-title">
            📋 My Tasks
        </h2>


        <ul id="homeTaskList"></ul>


    </div>


    <script src="script.js"></script>

</body>

</html>
